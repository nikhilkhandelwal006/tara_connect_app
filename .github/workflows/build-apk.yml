name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      CI: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        env:
          CI: false
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Create local.properties with SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Find APK
        run: find android -name "*.apk" 2>/dev/null || echo "APK not found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaraConnect-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
