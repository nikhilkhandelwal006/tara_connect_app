name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      CI: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Build Tools 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        env:
          CI: false
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Create local.properties with SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Release App Bundle
  run: |
    cd android
    ./gradlew bundleRelease --no-daemon 2>&1

  - name: Find AAB
  run: find android -name "*.aab" 2>/dev/null || echo "AAB not found"

      - name: Upload AAB Artifact
  uses: actions/upload-artifact@v4
  with:
    name: TaraConnect-App-AAB
    path: android/app/build/outputs/bundle/release/app-release.aab
    retention-days: 30
