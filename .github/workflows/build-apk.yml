name: Build Android App Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      CI: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Build Tools 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        env:
          CI: false
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Create local.properties with SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Generate Release Keystore and Sign AAB
        run: |
          keytool -genkeypair -v -keystore android/release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass taraconnect123 -keypass taraconnect123 -dname "CN=TaraConnect, OU=IT, O=TaraMedicos, L=Jaipur, ST=Rajasthan, C=IN"
          cd android
          ./gradlew bundleRelease --no-daemon 2>&1
          cd ..
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore android/release.keystore -storepass taraconnect123 -keypass taraconnect123 android/app/build/outputs/bundle/release/app-release.aab releasekey

      - name: Generate PEM Certificate for Play Console
        run: |
          keytool -export -rfc -keystore android/release.keystore -alias releasekey -file upload_certificate.pem -storepass taraconnect123

      - name: Upload PEM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Upload-Certificate-PEM
          path: upload_certificate.pem

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaraConnect-App-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
